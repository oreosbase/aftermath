<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFTERMATH data test</title>
<style>
body{font-family:sans-serif;background:#0b0b0f;color:#eee;padding:16px}
input,button{width:100%;padding:14px;margin:6px 0;font-size:16px;border-radius:8px;border:0;box-sizing:border-box}
button{background:#4ade80;font-weight:bold}
pre{white-space:pre-wrap;word-break:break-word;font-size:13px}
</style></head><body>
<h2>AFTERMATH data test</h2>
<input id="a" placeholder="Paste a Base wallet address (0x...)">
<button onclick="run()">Run test</button>
<pre id="o"></pre>
<script>
const out=m=>{document.getElementById('o').textContent+=m+'\n'};
async function t(name,fn){
  try{out('OK   '+name+': '+await fn())}
  catch(e){out('FAIL '+name+': '+e.message)}
}
async function get(url){
  const r=await fetch(url);
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
async function rpc(url,method,params){
  const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});
  const j=await r.json();
  if(j.error)throw new Error(j.error.message);
  return j.result;
}
async function run(){
  document.getElementById('o').textContent='';
  const addr=document.getElementById('a').value.trim().toLowerCase();
  if(!/^0x[0-9a-f]{40}$/.test(addr)){out('Not a valid address');return}
  const base='https://base.blockscout.com/api/v2/addresses/'+addr;
  await t('Blockscout transactions',async()=>(await get(base+'/transactions')).items.length+' found');
  await t('Blockscout token transfers',async()=>(await get(base+'/token-transfers')).items.length+' found');
  const topic='0x8c5be1e5ebec7d5bd14f71427d1e84f3dd0314c0f7b2291e5b200ac8c7c3b925';
  const owner='0x'+'0'.repeat(24)+addr.slice(2);
  const urls=['https://mainnet.base.org','https://base-rpc.publicnode.com','https://1rpc.io/base'];
  for(const u of urls){
    await t('RPC recent approvals '+u,async()=>{
      const head=parseInt(await rpc(u,'eth_blockNumber',[]),16);
      const logs=await rpc(u,'eth_getLogs',[{fromBlock:'0x'+(head-9000).toString(16),toBlock:'latest',topics:[topic,owner]}]);
      return logs.length+' found';
    });
    await t('RPC full-history approvals '+u,async()=>{
      const logs=await rpc(u,'eth_getLogs',[{fromBlock:'0x0',toBlock:'latest',topics:[topic,owner]}]);
      return logs.length+' found';
    });
  }
  out('Done.');
}
</script></body></html>
