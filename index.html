<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>AFTERMATH</title>
<style>
:root{--bg:#fff;--card:#fafafb;--line:#e8e8ec;--tx:#0b0b0f;--mut:#6b6b78;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0 auto;max-width:620px;min-height:100vh;padding:max(18px,env(safe-area-inset-top)) 16px 48px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--tx);line-height:1.5;background:radial-gradient(800px 340px at 50% -140px,#efeff3,transparent 70%)}
.hero{text-align:center;padding:16px 0 6px}
.logo{width:50px;height:50px;margin:0 auto 12px;border-radius:16px;display:grid;place-items:center;color:#fff;background:#0b0b0f;box-shadow:0 10px 26px rgba(0,0,0,.2)}
h1{margin:0;font-size:22px;letter-spacing:.32em;padding-left:.32em;font-weight:800}
.tag{margin:6px 0 0;color:var(--mut);font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 30px rgba(0,0,0,.04);animation:rise .5s ease both;animation-delay:calc(var(--i,0)*70ms)}
.lbl{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
input{width:100%;padding:15px 16px;font-size:16px;color:var(--tx);background:#fff;border:1px solid #d8d8df;border-radius:14px;outline:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:#0b0b0f;box-shadow:0 0 0 4px rgba(11,11,15,.08)}
.btn{width:100%;margin-top:10px;padding:15px;font-size:16px;font-weight:700;color:#fff;background:#0b0b0f;border:0;border-radius:14px;cursor:pointer;transition:transform .12s,opacity .2s;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5}
.btn.alt{background:#fff;color:var(--tx);box-shadow:none;border:1px solid #d8d8df}
.ghost{width:100%;margin-top:10px;padding:11px;font-size:13px;font-weight:600;color:var(--mut);background:transparent;border:1px dashed #cfcfd6;border-radius:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .btn{margin-top:0}
.hint{margin:10px 0 0;font-size:12.5px;color:var(--mut)}
.hint.err{color:var(--bad)}
.bar{height:2px;margin-top:12px;border-radius:2px;overflow:hidden;position:relative}
.bar.on{background:#ececf0}
.bar.on::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:#0b0b0f;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.hide{display:none}
#plist{list-style:none;margin:0;padding:0}
#plist li{display:flex;align-items:center;gap:10px;padding:7px 0;color:var(--mut);font-size:14px}
#plist i{width:14px;height:14px;border-radius:50%;border:2px solid #d8d8df;flex:none}
#plist li.run{color:var(--tx)}
#plist li.run i{border-top-color:#0b0b0f;animation:spin .7s linear infinite}
#plist li.ok{color:var(--tx)}
#plist li.ok i{background:#0b0b0f;border-color:#0b0b0f}
#plist li.err i{background:var(--bad);border-color:var(--bad)}
.sec{margin:0 0 10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
.verdict{display:flex;gap:14px;align-items:flex-start}
.ico{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;font-weight:800;color:#fff}
.verdict.good{background:linear-gradient(160deg,#eeeef1,#fff 65%)}
.verdict.warn{background:linear-gradient(160deg,#fff3dc,#fff 65%)}
.verdict.bad{background:linear-gradient(160deg,#fde6e6,#fff 65%)}
.good .ico{background:#0b0b0f;box-shadow:0 8px 22px rgba(0,0,0,.22)}
.warn .ico{background:var(--warn);box-shadow:0 8px 22px rgba(217,119,6,.3)}
.bad .ico{background:var(--bad);box-shadow:0 8px 22px rgba(220,38,38,.3)}
.vt{margin:0 0 4px;font-size:18px;font-weight:750}
.vb{font-size:14.5px;color:#2b2b33}
.vb p{margin:10px 0 0}
.evl{margin-top:10px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.045);font-size:12.5px}
.evl div{padding:4px 0;word-break:break-word}
.row{padding:12px 0;border-top:1px solid var(--line);font-size:14px;word-break:break-word}
.list .row:first-child{border-top:0;padding-top:2px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:10.5px;font-weight:800;letter-spacing:.06em;vertical-align:1px}
.OKP{background:#0b0b0f;color:#fff}.HIGH{background:var(--bad);color:#fff}.MEDIUM{background:#fbbf24;color:#3b2a00}.LOW{background:#e5e7eb;color:#374151}.SPAM{background:#e5e7eb;color:#6b7280}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.mut{color:var(--mut);font-size:13px}
.why{font-size:13px;color:#3f3f4a;margin-top:2px}
a.link{color:var(--tx);text-decoration:none;border-bottom:1px solid #b9b9c3}
details>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:650}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"›";font-size:20px;color:var(--mut);transform:rotate(90deg);transition:transform .2s}
details[open]>summary::after{transform:rotate(-90deg)}
.seg{display:flex;gap:6px;background:#ececf0;padding:4px;border-radius:14px;margin-bottom:8px}
.seg button{flex:1;padding:10px 6px;border:0;border-radius:10px;font-size:12.5px;font-weight:650;color:var(--mut);background:transparent;transition:background .2s,color .2s}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.12)}
ol.st{counter-reset:s;list-style:none;padding:0;margin:0}
ol.st li{counter-increment:s;position:relative;padding:10px 0 10px 38px;font-size:14.5px}
ol.st li::before{content:counter(s);position:absolute;left:0;top:9px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:#0b0b0f;color:#fff}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:#4b4b57;background:#f1f1f4;padding:10px;border-radius:10px;max-height:260px;overflow:auto;margin:10px 0 0}
.foot{color:var(--mut);font-size:12.5px;text-align:center;margin-top:22px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header class="hero">
<div class="logo"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></div>
<h1>AFTERMATH</h1>
<p class="tag">Scan any wallet or token on Base</p>
</header>
<section class="panel">
<div class="seg"><button id="t_wallet" class="on" onclick="setTab('wallet',true)">Check a wallet</button><button id="t_token" onclick="setTab('token',true)">Scan a token</button></div>
<p id="tabdesc" class="hint" style="margin:0 0 12px"></p>
<label class="lbl" id="lbl" for="addr">Wallet address</label>
<input id="addr" placeholder="0x…" autocomplete="off" autocapitalize="off" spellcheck="false">
<button id="go" class="btn" onclick="run()">Check wallet</button>
<button id="ex" class="ghost hide" onclick="useEx()">Try an example token (USDC)</button>
<p id="msg" class="hint">Public data only. Never enter a seed phrase or private key.</p>
<div id="bar" class="bar"></div>
</section>
<section id="prog" class="panel hide"><ul id="plist"></ul></section>
<div id="out"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BS='https://base.blockscout.com';
const RPCS=['https://mainnet.base.org','https://base-rpc.publicnode.com','https://1rpc.io/base'];
const APPROVAL='0x8c5be1e5ebec7d5bd14f71427d1e84f3dd0314c0f7b2291e5b200ac8c7c3b925';
const APPALL='0x17307eab39ab6107e8899845ad3d59bd9653f200f220920489ca2b5937696c31';
const PERMIT2='0x000000000022d473030f116ddee9f6b43ac78ba3';
const MAX=2n**255n;
const HX=/^0x[0-9a-fA-F]{64}$/;
const PSTEPS=[['wallet','Checking wallet'],['tx','Reading transactions'],['tr','Reading token transfers'],['appr','Finding approvals'],['live','Checking live permissions'],['link','Linking evidence']];
let S={mode:'unsure',showSpam:false};
let TAB='wallet';
const TABS={
  wallet:{label:'Wallet address',ph:'Your wallet address (0x…)',btn:'Check wallet',desc:'Find out if your wallet was drained, which permissions are risky, and what to do next.'},
  token:{label:'Token contract address',ph:'Token contract address (0x…)',btn:'Scan token',desc:'Check a token for warning signs before you buy: holders, contract code, owner and age.'}
};
function setTab(t,manual){
  const changed=t!==TAB;
  TAB=t;
  $('t_wallet').className=t==='wallet'?'on':'';
  $('t_token').className=t==='token'?'on':'';
  $('lbl').textContent=TABS[t].label;
  $('addr').placeholder=TABS[t].ph;
  $('tabdesc').textContent=TABS[t].desc;
  $('go').textContent=TABS[t].btn;
  if(t==='token')$('ex').classList.remove('hide');else $('ex').classList.add('hide');
  if(manual&&changed){
    $('out').innerHTML='';$('addr').value='';$('prog').classList.add('hide');
    setMsg('Public data only. Never enter a seed phrase or private key.',false);
  }
}
function useEx(){$('addr').value='0x833589fCD6eDb6E08f4c7C32D4f71b54bDA02913';setMsg('Example loaded. Tap Scan token.',false)}
const short=a=>a?a.slice(0,6)+'…'+a.slice(-4):'?';
const dt=ts=>ts?new Date(ts*1000).toISOString().slice(0,16).replace('T',' ')+' UTC':'unknown time';
const pad=a=>'0'.repeat(24)+a.slice(2).toLowerCase();
const lc=s=>(s||'').toLowerCase();
const txLink=h=>HX.test(h||'')?'<a class="link" href="https://basescan.org/tx/'+h+'" target="_blank" rel="noopener">'+short(h)+'</a>':esc(short(h));
function fmt(v,d){try{v=BigInt(v);d=Number(d||0);const s=v.toString().padStart(d+1,'0');const i=s.slice(0,s.length-d);const f=s.slice(s.length-d).replace(/0+$/,'').slice(0,6);return i+(f?'.'+f:'')}catch(e){return '?'}}
async function get(path){
  const u=path.startsWith('http')?path:BS+path;
  for(let i=0;i<2;i++){
    const r=await fetch(u);
    if(r.status===429&&i===0){await new Promise(z=>setTimeout(z,700));continue}
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }
}
async function pages(path,max){
  let items=[],q='',more=false;
  for(let i=0;i<max;i++){
    const j=await get(path+(q?(path.includes('?')?'&':'?')+q:''));
    items=items.concat(j.items||[]);
    if(j.next_page_params){q=new URLSearchParams(j.next_page_params).toString();more=true}else{more=false;break}
  }
  return {items,more};
}
async function ethCall(to,data){
  let err;
  for(const u of RPCS){
    try{
      const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_call',params:[{to,data},'latest']})});
      const j=await r.json();
      if(j.error)throw new Error(j.error.message);
      return j.result;
    }catch(e){err=e}
  }
  throw err;
}
async function getLogs(topic0,owner){
  const j=await get('/api?module=logs&action=getLogs&fromBlock=0&toBlock=latest&topic0='+topic0+'&topic1=0x'+pad(owner)+'&topic0_1_opr=and');
  if(!Array.isArray(j.result))throw new Error('unexpected reply');
  return j.result;
}
async function chunked(list,n,fn){
  for(let i=0;i<list.length;i+=n)await Promise.all(list.slice(i,i+n).map(fn));
}
function parseApprovals(l20,lAll){
  const evs=[];
  const add=(l,kind)=>{
    const t=(l.topics||[]).filter(Boolean);
    if(t.length<3)return;
    if(kind==='erc20'&&t.length!==3)return;
    const data=(l.data&&l.data!=='0x')?BigInt(l.data):0n;
    evs.push({kind,token:lc(l.address),spender:'0x'+t[2].slice(26).toLowerCase(),value:kind==='all'?(data>0n?1n:0n):data,ts:Number(l.timeStamp||0),block:Number(l.blockNumber||0),idx:Number(l.logIndex||0),tx:l.transactionHash||''});
  };
  l20.forEach(l=>add(l,'erc20'));lAll.forEach(l=>add(l,'all'));
  evs.sort((a,b)=>a.block-b.block||a.idx-b.idx);
  const m={};
  evs.forEach(e=>{m[e.kind+'|'+e.token+'|'+e.spender]=e});
  return Object.values(m);
}
function riskOf(a){
  const info=a.sInfo;let level='LOW';const why=[];
  const unl=a.kind==='erc20'&&a.cur>=MAX;
  if(a.kind==='all'){level='MEDIUM';why.push('can move ALL items in this collection')}
  else if(unl){level='MEDIUM';why.push('unlimited spending permission')}
  if(a.spender===PERMIT2){why.push('Permit2 is a common, widely used contract')}
  else if(!info){why.push('could not check who this address is')}
  else if(!info.is_contract){level='HIGH';why.push('spender is a regular wallet, not an app contract')}
  else if(!info.is_verified){level='HIGH';why.push('spender contract is not verified')}
  if(!why.length)why.push('limited permission to a verified contract');
  return {level,why,unl};
}
function initProg(list){
  $('plist').innerHTML=(list||PSTEPS).map(s=>'<li id="p_'+s[0]+'"><i></i>'+s[1]+'</li>').join('');
  $('prog').classList.remove('hide');
}
function mark(id,st){const e=$('p_'+id);if(e)e.className=st}
function setMsg(t,err){$('msg').textContent=t;$('msg').className='hint'+(err?' err':'')}
async function run(){
  const owner=lc($('addr').value.trim());
  if(!/^0x[0-9a-f]{40}$/.test(owner)){setMsg('That does not look like a valid address (0x followed by 40 characters).',true);return}
  setMsg('Public data only. Never enter a seed phrase or private key.',false);
  $('go').disabled=true;$('go').textContent='Working…';$('bar').classList.add('on');$('out').innerHTML='';
  let info0=null;
  try{info0=await get('/api/v2/addresses/'+owner)}catch(e){}
  if(info0&&info0.is_contract===true){
    let tk=null;
    try{const j=await get('/api/v2/tokens/'+owner);if(j&&/20/.test(j.type||''))tk=j}catch(e){}
    if(tk){
      if(TAB!=='token'){setTab('token');setMsg('That address is a token, so we scanned it as a token.',false)}
      try{await runToken(owner,info0,tk)}catch(e){$('out').innerHTML='<section class="panel"><b>Something went wrong.</b><div class="mut">'+esc(e.message)+'</div></section>'}
      finish();return;
    }
  }
  initProg(PSTEPS);
  if(TAB==='token'){setTab('wallet');setMsg('That address is a wallet, not a token, so we ran the wallet check.',false)}
  const diag=[];
  const task=async(id,name,fn,d)=>{mark(id,'run');try{const v=await fn();mark(id,'ok');return v}catch(e){diag.push(name+' ('+e.message+')');mark(id,'err');return d}};
  try{
    const E={items:[],more:false};
    const [info,tx,tr,ap]=await Promise.all([
      task('wallet','Wallet check',()=>info0||get('/api/v2/addresses/'+owner),null),
      task('tx','Transactions',()=>pages('/api/v2/addresses/'+owner+'/transactions',3),E),
      task('tr','Token transfers',()=>pages('/api/v2/addresses/'+owner+'/token-transfers',3),E),
      task('appr','Approval history',async()=>{const r=await Promise.all([getLogs(APPROVAL,owner),getLogs(APPALL,owner)]);return {a:r[0],b:r[1]}},null)
    ]);
    const isEOA=!!info&&info.is_contract===false;
    const approvalsOK=!!ap;
    const all=approvalsOK?parseApprovals(ap.a,ap.b):[];
    const cands=all.filter(a=>a.value>0n).sort((a,b)=>b.ts-a.ts).slice(0,40);
    mark('live','run');
    const toks={},sps={};
    await Promise.all([
      chunked(cands,6,async a=>{
        try{
          const r=await ethCall(a.token,(a.kind==='erc20'?'0xdd62ed3e'+pad(owner)+pad(a.spender):'0xe985e9c5'+pad(owner)+pad(a.spender)));
          const v=BigInt(r);a.cur=a.kind==='erc20'?v:(v>0n?1n:0n);a.live=true;
        }catch(e){a.cur=a.value;a.live=false}
      }),
      chunked([...new Set(cands.map(a=>a.token))],6,async t=>{try{toks[t]=await get('/api/v2/tokens/'+t)}catch(e){}}),
      chunked([...new Set(cands.map(a=>a.spender))],6,async s=>{try{sps[s]=await get('/api/v2/addresses/'+s)}catch(e){}})
    ]);
    mark('live','ok');
    cands.forEach(a=>{a.tInfo=toks[a.token];a.sInfo=sps[a.spender];a.risk=riskOf(a)});
    const active=cands.filter(a=>a.cur>0n);
    const revoked=cands.filter(a=>a.cur===0n).length;
    const order={HIGH:0,MEDIUM:1,LOW:2};
    active.sort((a,b)=>order[a.risk.level]-order[b.risk.level]);

    const events=[],ownTx=new Set(),outs=[];
    let spoof=0;
    const trHashes=new Set(tr.items.map(x=>lc(x.transaction_hash||x.tx_hash)));
    const hasRate=tr.items.some(x=>x.token&&('exchange_rate' in x.token));
    const apTokens=new Set(all.map(a=>a.token));
    const isPriced=tk=>!hasRate||(tk.exchange_rate!=null&&Number(tk.exchange_rate)>0);
    tx.items.forEach(x=>{
      const from=lc(x.from&&x.from.hash),to=lc(x.to&&x.to.hash),h=lc(x.hash);
      if(from===owner)ownTx.add(h);
      if((!x.value||x.value==='0')&&trHashes.has(h))return;
      const t=x.timestamp?Date.parse(x.timestamp)/1000:0;
      const out=from===owner;
      events.push({t,hash:x.hash,out,eth:!!(x.value&&x.value!=='0'),other:out?to:from,what:(x.method||'transaction')+(x.value&&x.value!=='0'?' · '+fmt(x.value,18)+' ETH':''),failed:x.status==='error'||x.result==='error'});
    });
    const coverFrom=tx.more?Math.min(...tx.items.map(x=>x.timestamp?Date.parse(x.timestamp)/1000:Infinity)):0;
    tr.items.forEach(x=>{
      const from=lc(x.from&&x.from.hash),to=lc(x.to&&x.to.hash);
      const tk=x.token||{};const taddr=lc(tk.address_hash||tk.address);
      const t=x.timestamp?Date.parse(x.timestamp)/1000:0;
      const hash=x.transaction_hash||x.tx_hash||'';
      const out=from===owner;
      const nft=/721|1155/.test(tk.type||'');
      const amt=nft?'NFT'+(x.total&&x.total.token_id?' #'+String(x.total.token_id).slice(0,12):''):fmt(x.total&&x.total.value,x.total&&x.total.decimals||tk.decimals);
      const zero=!nft&&(x.total==null||x.total.value==null||/^0+$/.test(String(x.total.value)));
      const spam=zero||(!isPriced(tk)&&!apTokens.has(taddr));
      const ev={t,hash,out,other:out?to:from,what:(out?'sent ':'received ')+amt+' '+(tk.symbol||tk.name||'token'),token:taddr,sym:tk.symbol||tk.name||'token',amt,spam,zero};
      events.push(ev);
      if(out&&isEOA&&hash&&!ownTx.has(lc(hash))&&t>=coverFrom){if(spam)spoof++;else outs.push(ev)}
    });
    events.sort((a,b)=>b.t-a.t);
    mark('link','run');
    const flagged=outs.slice(0,12);
    await chunked(flagged,6,async ev=>{
      try{
        const j=await get('/api/v2/transactions/'+ev.hash);
        ev.initiator=lc(j.from&&j.from.hash);ev.via=lc(j.to&&j.to.hash);
        ev.link=all.find(a=>(a.spender===ev.initiator||a.spender===ev.via)&&a.ts<=ev.t&&a.token===ev.token);
      }catch(e){return}
      if(ev.initiator===owner)return;
      const inTr=tr.items.some(x=>lc(x.transaction_hash||x.tx_hash)===lc(ev.hash)&&lc(x.to&&x.to.hash)===owner&&lc(x.from&&x.from.hash)!==owner&&isPriced(x.token||{})&&x.total&&x.total.value&&!/^0+$/.test(String(x.total.value)));
      try{
        const k=await get('/api/v2/transactions/'+ev.hash+'/internal-transactions');
        ev.paid=inTr||(k.items||[]).some(y=>lc(y.to&&y.to.hash)===owner&&y.value&&y.value!=='0');
      }catch(e){ev.paid=inTr?true:undefined}
    });
    mark('link','ok');
    const tp=flagged.filter(e=>e.initiator&&e.initiator!==owner);
    const paidTx=tp.filter(e=>e.paid===true);
    const suspect=tp.filter(e=>e.paid===false);
    const unverified=flagged.filter(e=>!e.initiator).length+tp.filter(e=>e.paid===undefined).length;
    const linked=suspect.filter(e=>e.link);
    const evl=suspect.length?'<div class="evl">'+suspect.slice(0,5).map(e=>'<div>'+esc(e.what)+' · '+esc(dt(e.t))+' · started by <span class="mono">'+esc(short(e.initiator))+'</span> · '+txLink(e.hash)+'</div>').join('')+'</div>':'';

    const times=events.map(e=>e.t).filter(Boolean);
    const low=(tx.items.length+tr.items.length)<3&&!tx.more&&!tr.more;
    const moves=events.filter(e=>e.out&&!e.zero&&(e.eth||(e.token!==undefined&&ownTx.has(lc(e.hash)))));
    const byTo={};
    moves.forEach(m=>{if(m.other)(byTo[m.other]=byTo[m.other]||[]).push(m)});
    let sweep=null;
    Object.keys(byTo).forEach(to=>{
      if(sweep)return;
      const arr=byTo[to].slice().sort((p,q)=>p.t-q.t);
      for(let k=0;k+2<arr.length;k++){
        if(arr[k+2].t-arr[k].t<=900){
          const start=arr[k].t;
          if(events.some(e=>e.other===to&&e.t<start-3600))break;
          const items=arr.filter(m=>m.t>=start&&m.t<=start+900);
          sweep={to,items};break;
        }

    });
    const evs=sweep?'<div class="evl">'+sweep.items.slice(0,5).map(e=>'<div>'+esc(e.what)+' · '+esc(dt(e.t))+' · to <span class="mono">'+esc(short(e.other))+'</span> · '+txLink(e.hash)+'</div>').join('')+'</div>':'';
    let F;

    }else if(linked.length){
      const e=linked[0];
      F={cls:'bad',title:'Approval abuse detected',html:'On '+esc(dt(e.link.ts))+' you approved <b>'+esc(short(e.link.spender))+'</b> to use '+esc(e.sym)+'. Later, a transaction started by '+(e.link.spender===e.initiator?'that address':'a contract tied to it')+' moved '+esc(e.amt)+' '+esc(e.sym)+' out of your wallet ('+esc(dt(e.t))+', tx '+esc(short(e.hash))+').'+(linked.length>1?' We found '+linked.length+' transfers like this.':'')+evl};
    }else if(suspect.length){
      F={cls:'bad',title:'Unexplained transfers',html:suspect.length+' of the '+flagged.length+' most recent priced transfers we checked'+(outs.length>flagged.length?' (out of '+outs.length+')':'')+' were started by a different address than yours, with no payment to you in the same transaction. That can happen through an approval you gave. We could not link them to a specific approval, so we are not naming a culprit.'+evl};
    }else if(sweep){
      const span=Math.max(1,Math.round((sweep.items[sweep.items.length-1].t-sweep.items[0].t)/60));
      F={cls:'warn',title:'Possible wallet sweep',html:sweep.items.length+' transfers left this wallet within about '+span+' minute'+(span===1?'':'s')+', all to one address ('+esc(short(sweep.to))+') this wallet had not dealt with before. That pattern fits an attacker who has this wallet\'s keys or permissions, but it can also be you moving funds to a new wallet. If you did not do this, treat the wallet as compromised.'+evs};
    }else if(active.some(a=>a.risk.level==='HIGH')){
      F={cls:'warn',title:'High-risk permissions active',html:'We found no transfers that look taken without you, but some permissions are still active and look risky (below).'};
    }else if(low){
      F={cls:'warn',title:'Little or no activity on Base',html:'We found only '+tx.items.length+' transaction'+(tx.items.length===1?'':'s')+' and '+tr.items.length+' token transfer'+(tr.items.length===1?'':'s')+' on Base for this address. AFTERMATH reads Base only. If this wallet was drained on Ethereum or another network, it will not show up here. Check it on that network\'s explorer.'};
    }else if(approvalsOK){
      F={cls:'good',title:'No drain found',html:'Nothing clearly suspicious in the history we could load. This does not prove your wallet is safe: if an attacker has your seed phrase or key, their transactions look like yours.'};
    }else{

    }
    if(paidTx.length)F.html+='<p>'+paidTx.length+' transfer'+(paidTx.length===1?'':'s')+' started by other addresses came with a payment to you in the same transaction (this looks like a sale or swap), so we did not flag '+(paidTx.length===1?'it':'them')+'.</p>';
    if(unverified)F.html+='<p>We could not double-check '+unverified+' transfer(s) because the data service was busy.</p>';
    if(spoof)F.html+='<p><b>Heads up:</b> we saw '+spoof+' transfer'+(spoof===1?'':'s')+' of zero-value, unpriced or look-alike tokens that appear to come from your address, but none were sent by your wallet. This is usually address poisoning or spam. Never copy an address from your transaction history.</p>';
    F.html+='<p class="mut">Scanned on Base: '+tx.items.length+' transaction'+(tx.items.length===1?'':'s')+' and '+tr.items.length+' token transfer'+(tr.items.length===1?'':'s')+(times.length?' from '+dt(Math.min(...times))+' to '+dt(Math.max(...times)):'')+(ethBal!==null?'. ETH balance now: '+ethBal:'')+'.'+(tx.more||tr.more?' Older history exists that we did not load.':'')+'</p>';
    S={mode:S.mode,showSpam:false,owner,F,active,revoked,events,outs:suspect,linked,diag,approvalsOK,spoof,spamCount:events.filter(e=>e.spam).length,more:tx.more||tr.more,capped:all.filter(a=>a.value>0n).length>40};
    S.report=buildReport();
    render();
  }catch(e){
    $('out').innerHTML='<section class="panel"><b>Something went wrong.</b><div class="mut">'+esc(e.message)+'</div></section>';
  }
  finish();
}

const DEAD=['0x0000000000000000000000000000000000000000','0x000000000000000000000000000000000000dead'];

  sig.forEach(x=>L.push('- ['+x.lvl+'] '+x.t+(x.d?': '+x.d:'')));
  L.push('','TOP HOLDERS');
  rows.slice(0,10).forEach(r=>L.push('- '+r.h+' '+r.pct+'%'+(r.burn?' (burn)':r.self?' (token contract)':r.contract?' (contract'+(r.name?': '+r.name:'')+')':'')));

  if(S.revoked)h+='<p class="hint">'+S.revoked+' earlier permission(s) already revoked.</p>';
  if(S.capped)h+='<p class="hint">Showing the 40 most recent permissions only.</p>';
  h+='<p class="hint">Verified does not mean safe. Scam contracts can be verified too.</p></section>';
  h+='<section class="panel" '+D()+'><h2 class="sec">What to do now</h2><div id="steps"></div></section>';
  h+='<section class="panel" '+D()+'><details><summary>Recent activity <span class="mut">'+S.events.filter(e=>!e.spam).length+'</span></summary><div id="tl" style="margin-top:10px">'+tlHTML()+'</div></details></section>';
  h+='<section class="panel" '+D()+'><h2 class="sec">Evidence report</h2><div class="grid2"><button class="btn" onclick="copyReport()">Copy report</button><button class="btn alt" onclick="shareReport()">Share</button></div><p id="cmsg" class="hint"></p><details style="margin-top:6px"><summary>Preview</summary><pre>'+esc(S.report)+'</pre></details></section>';
  if(S.diag.length)h+='<section class="panel" '+D()+'><h2 class="sec">Notes</h2><div class="hint">Some data could not be loaded, so results may be incomplete:<br>'+S.diag.map(esc).join('<br>')+'</div></section>';
  h+='<p class="foot">AFTERMATH reads public blockchain data only. It cannot recover funds, does not hold keys, and is not legal or financial advice.</p>';
  $('out').innerHTML=h;
  renderSteps();
}
setTab('wallet');
</script>
